[package]
name = "fkm-host-tests"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive", "alloc"] }
serde_json = "1"
heapless = "0.9.3"
serde-json-core = { version = "0.7.0", default-features = false }
embedded-graphics = "0.8.2"
profont = "0.7.0"
qrcodegen-no-heap = "1.8.1"

[features]
e2e = []
v3 = []
v4 = []
timer-func = []
qa = []

# standalone: the firmware manifest uses nightly-only cargo-features
[workspace]
